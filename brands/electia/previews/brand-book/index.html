<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brand Book — electia by emprega+</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0E14;
    --surface-1: #161B26;
    --surface-2: #1C2333;
    --border: #2A3444;
    --border-strong: #3D4A5C;
    --text: #E6EDF3;
    --text-secondary: #8B949E;
    --text-muted: #6E7681;
    --accent: #6f32b1;
    --accent-hover: #a55eea;
    --accent-on-dark: #c084fc;
    --accent-muted: rgba(111, 50, 177, 0.15);
    --gradient-vibrant: linear-gradient(135deg, #6f32b1 0%, #2040a0 100%);
  }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  body { font-size: 15px; line-height: 1.65; }

  .brand-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11, 14, 20, 0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex; align-items: baseline; gap: 16px;
  }
  .brand-bar .wm { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 22px; letter-spacing: -0.04em; color: var(--text); }
  .brand-bar .by { font-family: 'Sora', sans-serif; font-weight: 400; font-size: 12px; color: var(--text); opacity: 0.55; }
  .brand-bar .em { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); opacity: 0.85; letter-spacing: -0.01em; }
  .brand-bar::after { content: ""; position: absolute; inset: auto 0 -1px; height: 1px; background: var(--gradient-vibrant); opacity: 0.7; }
  .brand-bar .badge { margin-left: auto; font-family: 'Sora', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-on-dark); border: 1px solid rgba(165,94,234,0.45); background: var(--accent-muted); padding: 4px 10px; border-radius: 999px; }

  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); max-width: 1300px; margin: 0 auto; gap: 40px; padding: 32px 24px 80px; }

  .toc {
    position: sticky; top: 80px;
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.7;
  }
  .toc h2 { font-family: 'Sora', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-on-dark); margin-bottom: 14px; font-weight: 600; }
  .toc a { display: block; padding: 4px 10px; color: var(--text-secondary); text-decoration: none; border-left: 2px solid transparent; border-radius: 0 4px 4px 0; transition: all 0.15s; }
  .toc a:hover { color: var(--text); border-left-color: var(--accent-hover); background: var(--accent-muted); }
  .toc a.active { color: var(--accent-on-dark); border-left-color: var(--accent-hover); background: var(--accent-muted); font-weight: 500; }

  .content { max-width: 760px; }
  .content h1 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; margin-bottom: 12px; line-height: 1.2; }
  .content h2 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin-top: 56px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); scroll-margin-top: 90px; }
  .content h3 { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 18px; margin-top: 32px; margin-bottom: 12px; color: var(--text); }
  .content h4 { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px; margin-top: 20px; margin-bottom: 8px; color: var(--accent-on-dark); }
  .content p { margin-bottom: 14px; color: var(--text); }
  .content p strong { color: var(--text); font-weight: 600; }
  .content em { color: var(--accent-on-dark); font-style: normal; font-weight: 500; }
  .content blockquote {
    border-left: 3px solid var(--accent-hover);
    background: var(--accent-muted);
    padding: 14px 18px; margin: 18px 0;
    border-radius: 0 8px 8px 0;
    color: var(--text);
  }
  .content blockquote p:last-child { margin-bottom: 0; }
  .content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent-on-dark);
  }
  .content pre {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 18px 0;
    overflow-x: auto;
  }
  .content pre code { background: transparent; padding: 0; color: var(--text); font-size: 12px; line-height: 1.6; }
  .content ul, .content ol { margin: 12px 0 18px 24px; }
  .content li { margin-bottom: 6px; color: var(--text); }
  .content li::marker { color: var(--text-muted); }
  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0;
    font-size: 13.5px;
    background: var(--surface-1);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .content th { background: var(--surface-2); padding: 10px 14px; text-align: left; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-on-dark); border-bottom: 1px solid var(--border); }
  .content td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .content tr:last-child td { border-bottom: none; }
  .content tr:hover td { background: rgba(111,50,177,0.04); }
  .content a { color: var(--accent-on-dark); text-decoration: none; border-bottom: 1px dashed rgba(192,132,252,0.45); }
  .content a:hover { border-bottom-style: solid; }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 56px 0; }

  .loading { padding: 64px 32px; text-align: center; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .toc { display: none; }
  }
</style>
</head>
<body>

<div class="brand-bar">
  <span class="wm">electia</span>
  <span class="by">by</span>
  <span class="em">emprega+</span>
  <span class="badge">Brand Book v2.1</span>
</div>

<div class="layout">
  <nav class="toc" aria-label="Sumario">
    <h2>Sumario</h2>
    <div id="toc-list">
      <span style="opacity:0.4">carregando...</span>
    </div>
  </nav>

  <article class="content" id="content">
    <div class="loading">Carregando BRAND-BOOK.md...</div>
  </article>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  async function loadBrandBook() {
    try {
      const resp = await fetch('../../docs/BRAND-BOOK.md');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const md = await resp.text();
      const html = marked.parse(md, { gfm: true, breaks: false });
      const content = document.getElementById('content');
      content.innerHTML = html;

      const headings = content.querySelectorAll('h2');
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';
      headings.forEach((h, i) => {
        const slug = 'sec-' + i;
        h.id = slug;
        const a = document.createElement('a');
        a.href = '#' + slug;
        a.textContent = h.textContent.replace(/^##\s*/, '');
        tocList.appendChild(a);
      });

      const links = tocList.querySelectorAll('a');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const id = e.target.id;
            links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
          }
        });
      }, { rootMargin: '-90px 0px -60% 0px', threshold: 0 });
      headings.forEach(h => obs.observe(h));

      // Auto-render color swatches before any code that looks like a color
      content.querySelectorAll('code').forEach(code => {
        const txt = code.textContent.trim();
        const hex = txt.match(/^#([0-9a-fA-F]{3,8})$/);
        const rgba = txt.match(/^rgba?\([^)]+\)$/);
        if (hex || rgba) {
          if (code.previousElementSibling && code.previousElementSibling.classList?.contains('color-swatch')) return;
          const sw = document.createElement('span');
          sw.className = 'color-swatch';
          sw.style.cssText = 'display:inline-block;width:13px;height:13px;border-radius:3px;background:' + txt + ';margin-right:6px;border:1px solid rgba(255,255,255,0.18);vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,0.3) inset;';
          code.parentNode.insertBefore(sw, code);
        }
      });

    } catch (err) {
      document.getElementById('content').innerHTML =
        '<div class="loading" style="color:#FB7185">Erro carregando BRAND-BOOK.md: ' + err.message + '</div>';
    }
  }
  loadBrandBook();
</script>

</body>
</html>

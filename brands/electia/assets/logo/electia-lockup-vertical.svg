<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="electia by emprega+">
  <title>electia by emprega+ — lockup vertical</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;family=Sora:wght@400;800&amp;display=swap');
      .electia { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 64px; letter-spacing: -0.04em; fill: #E6EDF3; }
      .by      { font-family: 'Sora', sans-serif; font-weight: 400; font-size: 18px; fill: #E6EDF3; opacity: 0.55; }
      .empregamais { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.01em; fill: #E6EDF3; opacity: 0.85; }
    </style>
  </defs>
  <rect width="360" height="180" fill="#0B0E14"/>
  <text class="electia" x="180" y="84" text-anchor="middle">electia</text>
  <g transform="translate(110, 130)">
    <text class="by" x="0" y="0">by</text>
    <text class="empregamais" x="34" y="0">emprega+</text>
  </g>
</svg>

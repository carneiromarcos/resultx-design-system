<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Neural mesh pattern Electia — abstract synapse network background">
  <!-- Linhas conectoras (edges) — 0.14-0.45 opacity -->
  <g stroke="#14B8A6" stroke-width="1" fill="none">
    <line x1="50"  y1="60"  x2="140" y2="30"  stroke-opacity="0.32"/>
    <line x1="50"  y1="60"  x2="80"  y2="150" stroke-opacity="0.40"/>
    <line x1="140" y1="30"  x2="240" y2="80"  stroke-opacity="0.28"/>
    <line x1="140" y1="30"  x2="200" y2="170" stroke-opacity="0.18"/>
    <line x1="240" y1="80"  x2="320" y2="40"  stroke-opacity="0.34"/>
    <line x1="240" y1="80"  x2="290" y2="140" stroke-opacity="0.45"/>
    <line x1="320" y1="40"  x2="430" y2="70"  stroke-opacity="0.30"/>
    <line x1="320" y1="40"  x2="380" y2="180" stroke-opacity="0.16"/>
    <line x1="430" y1="70"  x2="530" y2="50"  stroke-opacity="0.36"/>
    <line x1="430" y1="70"  x2="480" y2="140" stroke-opacity="0.32"/>
    <line x1="530" y1="50"  x2="570" y2="200" stroke-opacity="0.20"/>
    <line x1="80"  y1="150" x2="200" y2="170" stroke-opacity="0.32"/>
    <line x1="80"  y1="150" x2="150" y2="280" stroke-opacity="0.22"/>
    <line x1="200" y1="170" x2="290" y2="140" stroke-opacity="0.30"/>
    <line x1="200" y1="170" x2="250" y2="240" stroke-opacity="0.38"/>
    <line x1="290" y1="140" x2="380" y2="180" stroke-opacity="0.34"/>
    <line x1="290" y1="140" x2="360" y2="290" stroke-opacity="0.15"/>
    <line x1="380" y1="180" x2="480" y2="140" stroke-opacity="0.40"/>
    <line x1="380" y1="180" x2="460" y2="260" stroke-opacity="0.20"/>
    <line x1="480" y1="140" x2="570" y2="200" stroke-opacity="0.28"/>
    <line x1="480" y1="140" x2="550" y2="320" stroke-opacity="0.14"/>
    <line x1="40"  y1="250" x2="150" y2="280" stroke-opacity="0.30"/>
    <line x1="40"  y1="250" x2="100" y2="360" stroke-opacity="0.24"/>
    <line x1="150" y1="280" x2="250" y2="240" stroke-opacity="0.42"/>
    <line x1="150" y1="280" x2="220" y2="380" stroke-opacity="0.20"/>
    <line x1="250" y1="240" x2="360" y2="290" stroke-opacity="0.36"/>
    <line x1="250" y1="240" x2="340" y2="360" stroke-opacity="0.18"/>
    <line x1="360" y1="290" x2="460" y2="260" stroke-opacity="0.32"/>
    <line x1="360" y1="290" x2="440" y2="390" stroke-opacity="0.16"/>
    <line x1="460" y1="260" x2="550" y2="320" stroke-opacity="0.30"/>
    <line x1="460" y1="260" x2="540" y2="360" stroke-opacity="0.22"/>
    <line x1="100" y1="360" x2="220" y2="380" stroke-opacity="0.28"/>
    <line x1="220" y1="380" x2="340" y2="360" stroke-opacity="0.34"/>
    <line x1="340" y1="360" x2="440" y2="390" stroke-opacity="0.28"/>
    <line x1="440" y1="390" x2="540" y2="360" stroke-opacity="0.30"/>
  </g>

  <!-- Nodes "bright" (cluster destacado) -->
  <g fill="#14B8A6">
    <circle cx="240" cy="80"  r="3.2"/>
    <circle cx="290" cy="140" r="3.2"/>
    <circle cx="250" cy="240" r="3.2"/>
    <circle cx="380" cy="180" r="3.2"/>
    <circle cx="150" cy="280" r="3.0"/>
    <circle cx="460" cy="260" r="3.0"/>
  </g>

  <!-- Nodes "medium" -->
  <g fill="#14B8A6" fill-opacity="0.70">
    <circle cx="50"  cy="60"  r="2.6"/>
    <circle cx="140" cy="30"  r="2.6"/>
    <circle cx="320" cy="40"  r="2.6"/>
    <circle cx="430" cy="70"  r="2.6"/>
    <circle cx="80"  cy="150" r="2.6"/>
    <circle cx="200" cy="170" r="2.6"/>
    <circle cx="480" cy="140" r="2.6"/>
    <circle cx="360" cy="290" r="2.6"/>
    <circle cx="220" cy="380" r="2.6"/>
    <circle cx="340" cy="360" r="2.6"/>
  </g>

  <!-- Nodes "subtle" -->
  <g fill="#14B8A6" fill-opacity="0.40">
    <circle cx="530" cy="50"  r="2.2"/>
    <circle cx="570" cy="200" r="2.2"/>
    <circle cx="40"  cy="250" r="2.2"/>
    <circle cx="550" cy="320" r="2.2"/>
    <circle cx="100" cy="360" r="2.2"/>
    <circle cx="440" cy="390" r="2.2"/>
    <circle cx="540" cy="360" r="2.2"/>
  </g>
</svg>

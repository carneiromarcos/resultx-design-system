<section data-family="standard">
<h2>Indicadores em grade</h2>
<div class="stat-grid">
<article class="stat-card">
<div class="stat-header">
<h3 class="stat-label">Atividades concluídas</h3>
<span class="stat-icon-bubble icon-badge-green" aria-hidden="true">✓</span>
</div>
<p class="stat-number">42</p>
<p class="stat-variation up">↑ 12% <span class="vs">em relação ao período anterior</span>
</p>
</article>
<article class="stat-card">
<div class="stat-header">
<h3 class="stat-label">Atividades pendentes</h3>
<span class="stat-icon-bubble icon-badge-blue" aria-hidden="true">+</span>
</div>
<p class="stat-number">8</p>
<p class="stat-variation down">↓ 3% <span class="vs">em relação ao período anterior</span>
</p>
</article>
</div>
</section>
<section data-family="mini">
<h2>Indicadores menores</h2>
<div class="catalog-row">
<article class="stat-card stat-card-mini">
<p class="stat-card-mini-value">86</p>
<h3 class="stat-card-mini-label">Total do exemplo</h3>
</article>
<article class="stat-card stat-card-mini">
<p class="stat-card-mini-value">—</p>
<h3 class="stat-card-mini-label">Sem medição neste período</h3>
</article>
</div>
</section>
<section data-family="progress">
<h2>Indicador com andamento</h2>
<article class="stat-card">
<h3 class="stat-label">Etapa concluída</h3>
<p class="stat-number">100%</p>
<div class="stat-progress" role="progressbar" aria-label="Etapa concluída" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
<div class="stat-progress-fill catalog-progress-complete">
</div>
</div>
</article>
</section>

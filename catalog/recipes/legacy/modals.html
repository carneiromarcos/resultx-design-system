<section data-family="default"><h2>Tamanho padrão</h2><div class="modal-overlay"><section class="modal" aria-label="Amostra da janela anterior"><header class="modal-header"><h3 class="modal-title">Confirmar ação</h3><button type="button" class="modal-close" aria-label="Fechar demonstração">×</button></header><div class="modal-body"><p>Deseja continuar com esta ação?</p></div><footer class="modal-footer"><button type="button" class="btn btn-secondary">Cancelar</button><button type="button" class="btn btn-primary">Confirmar</button></footer></section></div></section>
<section data-family="small"><h2>Janela pequena</h2><div class="modal-overlay"><section class="modal modal-sm" aria-label="Amostra pequena"><header class="modal-header"><h3 class="modal-title">Excluir item</h3><button type="button" class="modal-close" aria-label="Fechar demonstração">×</button></header><div class="modal-body"><p>O item deixará de aparecer na lista.</p></div><footer class="modal-footer"><button type="button" class="btn btn-secondary">Cancelar</button><button type="button" class="btn btn-danger">Excluir</button></footer></section></div></section>
<section data-family="large"><h2>Janela com formulário</h2><div class="modal-overlay"><section class="modal modal-lg" aria-label="Amostra com formulário"><header class="modal-header"><h3 class="modal-title">Editar perfil</h3><button type="button" class="modal-close" aria-label="Fechar demonstração">×</button></header><div class="modal-body"><label class="form-label" for="legacy-modal-name">Nome de exemplo</label><input class="form-input" id="legacy-modal-name" placeholder="Informe o nome"><label class="form-label" for="legacy-modal-email">E-mail de exemplo</label><input class="form-input" type="email" id="legacy-modal-email" placeholder="Informe o endereço"></div><footer class="modal-footer"><button type="button" class="btn btn-ghost">Cancelar</button><button type="button" class="btn btn-primary">Salvar</button></footer></section></div></section>

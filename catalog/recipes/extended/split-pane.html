<section data-family="resizable">
<h2>Conteúdo e painel ajustável</h2>
<div class="split-pane" data-split-pane data-split-id="catalog-panel">
<div class="split-pane-main">
<div class="content">
<h3>Lista de exemplo</h3>
<a class="btn btn-secondary btn-sm" href="#destination">Abrir item</a>
<p>O conteúdo principal usa o espaço restante.</p>
</div>
</div>
<div class="split-pane-handle" aria-label="Ajustar largura do painel">
</div>
<aside class="split-pane-side">
<div class="content">
<h3>Detalhe do item</h3>
<p>Use as setas no divisor em telas largas. No celular os dois blocos ficam empilhados.</p>
<a class="btn btn-secondary btn-sm" href="#destination">Ver detalhe completo</a>
</div>
</aside>
</div>
</section>
<section data-family="start">
<h2>Painel do outro lado</h2>
<div class="split-pane split-pane-start" data-split-pane data-split-id="catalog-panel-start">
<aside class="split-pane-side">
<div class="content">Painel inicial</div>
</aside>
<div class="split-pane-handle" aria-label="Ajustar painel inicial">
</div>
<div class="split-pane-main">
<div class="content">Conteúdo principal</div>
</div>
</div>
</section>

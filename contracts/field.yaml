versao: 1
componente: Field
anatomia:
  - label associado
  - input, select nativo ou textarea
  - mensagem de ajuda ou erro associada
variantes:
  - text
  - search
  - select
  - textarea
formatos_entrada:
  numerico:
    elemento: input type="text"
    inputmode: numeric
    semantica: Sugere teclado numérico; não valida nem transforma o valor.
  dinheiro:
    elemento: input type="text"
    inputmode: decimal
    semantica: Sugere teclado decimal; não formata nem calcula valores.
integracoes:
  select2:
    regra: Os controles fechados single e multiple preservam borda, fundo, raio e padding do campo; também mantêm altura mínima, foco e erro do select nativo.
    lista_aberta: Fora do escopo deste contrato.
estados:
  normal: Controle editável.
  carregando: aria-busy no grupo enquanto processa.
  vazio: Valor vazio permitido quando não obrigatório.
  erro: aria-invalid e aria-describedby apontam para erro.
  desabilitado: disabled nativo.
  foco: Anel visível.
tokens:
  - '--bg-surface-1'
  - '--bg-base'
  - '--text-primary'
  - '--text-muted'
  - '--text-sm'
  - '--leading-relaxed'
  - '--font-body'
  - '--text-base'
  - '--focus-ring-width'
  - '--focus-ring-offset'
  - '--accent-primary-text'
  - '--text-secondary'
  - '--space-2'
  - '--space-4'
  - '--space-10'
  - '--radius-md'
  - '--font-semibold'
  - '--color-error'
teclado:
  - Tab foca o controle.
  - Digitação altera o valor.
aria:
  - label programático obrigatório.
  - Erro de input, select e textarea associado por aria-describedby e aria-invalid.
  - Select2 mantém o select nativo de origem com aria-invalid e aria-describedby.
criterios_aceite:
  - Texto ≥ 4,5:1; borda e foco ≥ 3:1.
  - Erro é identificável sem depender de cor.
casos_teste:
  - id: field-label
    descricao: O controle tem rótulo associado.
  - id: field-error
    descricao: Input, select e textarea com erro usam aria-invalid e descrição associada.
  - id: field-select
    descricao: Select nativo tem label, ocupa o wrapper e mantém chevron e texto dentro do campo.
  - id: field-select2-skin
    descricao: Select2 fechado single e multiple preserva a borda, o fundo e a geometria do campo nos dois temas.
  - id: field-textarea
    descricao: Textarea preserva o foco e pode ser redimensionado apenas verticalmente.
  - id: field-inputmode-numeric
    descricao: Campo numérico sugere teclado numeric sem impor validação.
  - id: field-inputmode-money
    descricao: Campo monetário sugere teclado decimal sem impor formatação.
  - id: field-disabled
    descricao: Campo desabilitado não aceita interação.
  - id: field-keyboard
    descricao: Tab foca e digitação altera o valor.
  - id: field-contrast
    descricao: Texto e bordas do campo mantêm contraste.
  - id: field-loading
    descricao: Grupo em carregamento indica aria-busy e desabilita controle.
  - id: field-empty
    descricao: Controle vazio opcional aceita valor vazio.
conformidade: >-
  Cada adaptador deve executar todos estes casos contra sua própria vitrine; exemplos de outro
  adaptador não comprovam conformidade.
cobertura_estados:
  normal: field-label
  carregando: field-loading
  vazio: field-empty
  erro: field-error
  desabilitado: field-disabled
  foco: field-keyboard

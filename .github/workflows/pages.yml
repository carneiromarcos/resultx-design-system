name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Se o job `deploy` falhar por transiente do GitHub (ECONNRESET, 500 ao
# criar o deployment), NAO use "Re-run failed jobs": a re-execucao sobe um
# segundo artefato `github-pages` no MESMO run e o deploy-pages recusa com
# "Multiple artifacts named github-pages ... Artifact count is 2". Foi o
# que deixou o site uma versao atras em 17/09/2026 (run 35283203139,
# tentativa 2). Dispare um run novo:  gh workflow run pages.yml --ref main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run build

      - name: Prepare pages directory
        # Caminhos alinhados a estrutura pos-2affe96 (reorganizacao de pastas):
        # o visualizador virou docs/viewer.html e pages/ virou demos/. O
        # workflow ficou para tras e o deploy falhava no `cp` desde entao.
        # `set -euo pipefail` para que um caminho que suma de novo derrube o
        # passo com erro claro, em vez de publicar um site pela metade.
        run: |
          set -euo pipefail
          mkdir -p _site
          # O viewer usa caminhos relativos a docs/ (../dist, ../demos). Copiado
          # para index.html na raiz eles apontariam para fora do site, entao a
          # raiz so redireciona para docs/viewer.html, que ja vai em `cp -r docs`.
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><title>ResultX Design System</title>
          <meta http-equiv="refresh" content="0; url=docs/viewer.html">
          <link rel="canonical" href="docs/viewer.html"></head>
          <body><p><a href="docs/viewer.html">ResultX Design System — abrir o viewer</a></p></body></html>
          HTML
          cp -r dist _site/dist
          cp -r tokens _site/tokens
          cp -r components _site/components
          cp -r docs _site/docs
          cp -r demos _site/demos
          mkdir -p _site/brands
          cp -r brands/resultx _site/brands/resultx
          cp DESIGN-SYSTEM.md _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

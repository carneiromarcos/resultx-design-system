name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build

      - name: Prepare pages directory
        # Caminhos alinhados a estrutura pos-2affe96 (reorganizacao de pastas):
        # o visualizador virou docs/viewer.html e pages/ virou demos/. O
        # workflow ficou para tras e o deploy falhava no `cp` desde entao.
        # `set -euo pipefail` para que um caminho que suma de novo derrube o
        # passo com erro claro, em vez de publicar um site pela metade.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/viewer.html _site/index.html
          cp -r dist _site/dist
          cp -r tokens _site/tokens
          cp -r components _site/components
          cp -r docs _site/docs
          cp -r demos _site/demos
          cp DESIGN-SYSTEM.md _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

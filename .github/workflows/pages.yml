name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Se o job `deploy` falhar por transiente do GitHub (ECONNRESET, 500 ao
# criar o deployment), NAO use "Re-run failed jobs": a re-execucao sobe um
# segundo artefato `github-pages` no MESMO run e o deploy-pages recusa com
# "Multiple artifacts named github-pages ... Artifact count is 2". Foi o
# que deixou o site uma versao atras em 17/09/2026 (run 35283203139,
# tentativa 2). Dispare um run novo:  gh workflow run pages.yml --ref main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run build

      - run: npm run build:catalog

      # Mesma montagem exercitada pelos testes de publicação.
      - name: Prepare pages directory
        run: node scripts/prepare-pages.cjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
